name: monthly-monitor
on:
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Deterministic smoke test
        run: python -m commercial_monitor.cli --sample --out /tmp/sample-data
      - name: Live monitor
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m commercial_monitor.cli --live --out data
      - name: Build paper PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/main.tex
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ paper/main.pdf
          git diff --cached --quiet || git commit -m "chore: refresh monitoring data and paper PDF"
          git push
